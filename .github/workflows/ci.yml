name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # Every Go test file carries a build tag, so a bare `go test ./...`
      # compiles no tests at all — the tags are required.
      - name: Go tests (unit + integration)
        run: go test -tags "unit integration" ./...

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Frontend tests
        run: node --test "tests/js/*.test.mjs"

      - name: Browser test dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Corrupted SBOM recovery
        run: go test -tags e2e -run "^TestCorruptedRecordsStayOutOfAnalysis$" .

      - name: Build browser test service
        run: go test -tags e2e -c -o "${RUNNER_TEMP}/ex-sbom-browser.test" .

      - name: Browser regression tests
        working-directory: tests/e2e
        env:
          EX_SBOM_E2E_BINARY: ${{ runner.temp }}/ex-sbom-browser.test
        run: npm test

      - name: Verify performance measurement entry point
        run: |
          perf_dir="$(mktemp -d)"
          versions=2
          go run ./tests/perf/cmd/seed -db "$perf_dir/data.duckdb" -versions "$versions" -components 8 > "$perf_dir/fixture.json"
          node tests/perf/measure.mjs "${RUNNER_TEMP}/ex-sbom-browser.test" "$perf_dir/data.duckdb" "$perf_dir/fixture.json" 1 "$versions"

      - name: Upload browser failure details
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-failures
          path: tests/e2e/test-results/
          if-no-files-found: ignore
