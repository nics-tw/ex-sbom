name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # Every Go test file carries a build tag, so a bare `go test ./...`
      # compiles no tests at all — the tags are required.
      - name: Go tests (unit + integration)
        run: go test -tags "unit integration" ./...

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Frontend tests
        run: node --test "tests/js/*.test.mjs"

      - name: Browser test dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Chromium and PDF text extractor
        working-directory: tests/e2e
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Corrupted SBOM recovery
        run: go test -tags e2e -run "^TestCorruptedRecordsStayOutOfAnalysis$" .

      - name: Build browser test service
        run: go test -tags e2e -c -o "${RUNNER_TEMP}/ex-sbom-browser.test" .

      - name: Browser regression tests
        working-directory: tests/e2e
        env:
          EX_SBOM_E2E_BINARY: ${{ runner.temp }}/ex-sbom-browser.test
        run: npm test

      - name: Verify performance measurement entry point
        run: |
          perf_dir="$(mktemp -d)"
          versions=2
          go run ./tests/perf/cmd/seed -db "$perf_dir/data.duckdb" -versions "$versions" -components 8 > "$perf_dir/fixture.json"
          node tests/perf/measure.mjs "${RUNNER_TEMP}/ex-sbom-browser.test" "$perf_dir/data.duckdb" "$perf_dir/fixture.json" 1 "$versions"

      - name: Upload browser failure details
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-failures
          path: tests/e2e/test-results/
          if-no-files-found: ignore

  tagged-pdf:
    name: tagged-pdf-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-amd64
            archive: typst-x86_64-unknown-linux-musl.tar.xz
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            archive: typst-aarch64-unknown-linux-musl.tar.xz
          - runner: macos-15
            platform: darwin-arm64
            archive: typst-aarch64-apple-darwin.tar.xz
          - runner: windows-2025
            platform: windows-amd64
            archive: typst-x86_64-pc-windows-msvc.zip
    defaults:
      run:
        shell: bash
    env:
      TAGGED_PLATFORM: ${{ matrix.platform }}
      TYPST_ARCHIVE: ${{ matrix.archive }}
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod

      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
        if: runner.os == 'Windows'
        id: ucrt
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-poppler
            unzip

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: runner.os == 'Windows'
        with:
          repository: typst/typst
          ref: 9dfd3a08500b7896045f907433cf7b4b02434fad # v0.15.1
          path: .typst-source
          persist-credentials: false

      - name: Cache the Windows Typst build
        if: runner.os == 'Windows'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .typst-source/target
          key: typst-windows-amd64-crt-static-rust-1.95.0-9dfd3a08500b7896045f907433cf7b4b02434fad

      - name: Build Typst with a static C runtime
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: .typst-source
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.95.0 build --locked --release -p typst-cli --target x86_64-pc-windows-msvc

      - name: Set the Windows C and PDF tools
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.ucrt.outputs.msys2-location }}
        run: |
          (Join-Path $env:MSYS2_ROOT 'ucrt64\bin') >> $env:GITHUB_PATH
          # The bundled DuckDB archive expects emulated TLS symbols absent from MSYS2 GCC 16.
          'CC=C:/mingw64/bin/gcc.exe' >> $env:GITHUB_ENV

      - name: Verify native platform and install Poppler
        run: |
          set -euo pipefail
          test "$(go env GOOS)-$(go env GOARCH)" = "$TAGGED_PLATFORM"
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends poppler-utils
          elif [[ "$RUNNER_OS" == macOS ]]; then
            brew install poppler
          else
            compiler="$(cygpath -u "$CC")"
            test "$("$compiler" -dumpmachine)" = x86_64-w64-mingw32
            "$compiler" --version
            command -v python pdfinfo pdftotext pdffonts pdftohtml objdump
          fi

      - name: Set up PDF/UA validation
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache the pinned Typst and font inputs
        id: assets
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/tagged-pdf-assets
          key: tagged-pdf-assets-${{ matrix.platform }}-${{ hashFiles('scripts/prepare-tagged-pdf-assets.sh') }}

      - name: Download pinned tagged PDF assets
        if: steps.assets.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          runner_temp="$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == Windows ]]; then
            runner_temp="$(cygpath -u "$runner_temp")"
          fi
          asset_dir="$runner_temp/tagged-pdf-assets"
          mkdir -p "$asset_dir"

          download() {
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --retry 3 --connect-timeout 15 --max-time 180 --output "$asset_dir/$2" "$1"
          }

          cjk_base=https://raw.githubusercontent.com/notofonts/noto-cjk/refs/tags/Sans2.004
          emoji_base=https://raw.githubusercontent.com/google/fonts/06bfe0d62a98375cb09c942fa18e68bd32cff057/ofl/notoemoji
          download "https://github.com/typst/typst/releases/download/v0.15.1/$TYPST_ARCHIVE" "$TYPST_ARCHIVE"
          download "$cjk_base/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf" NotoSansCJKtc-Regular.otf
          download "$cjk_base/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Bold.otf" NotoSansCJKtc-Bold.otf
          download "$cjk_base/LICENSE" NotoSansCJKtc-OFL.txt
          download "$emoji_base/NotoEmoji%5Bwght%5D.ttf" NotoEmoji.ttf
          download "$emoji_base/OFL.txt" NotoEmoji-OFL.txt

      - name: Verify hashes and prepare tagged PDF assets
        if: runner.os != 'Windows'
        run: bash scripts/prepare-tagged-pdf-assets.sh --from "$RUNNER_TEMP/tagged-pdf-assets"

      - name: Verify hashes and package the static Windows renderer
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          bash scripts/prepare-tagged-pdf-assets.sh --from "$(cygpath -u "$RUNNER_TEMP")/tagged-pdf-assets" \
            --with-static-windows-typst .typst-source/target/x86_64-pc-windows-msvc/release/typst.exe

      - name: Verify downloads from the release executable
        run: |
          set -euo pipefail
          runner_temp="$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == Windows ]]; then
            runner_temp="$(cygpath -u "$runner_temp")"
          fi
          release_dir="$runner_temp/tagged-pdf-release"
          evidence_dir="$runner_temp/tagged-pdf-evidence"
          fixture_dir="$(mktemp -d "$runner_temp/tagged-pdf-fixture.XXXXXX")"
          cleanup() {
            if [[ "$RUNNER_OS" == Linux && -n "${EX_SBOM_PDF_TEST_TMPDIR:-}" ]] && mountpoint -q "$EX_SBOM_PDF_TEST_TMPDIR"; then
              sudo umount "$EX_SBOM_PDF_TEST_TMPDIR"
            fi
            rm -rf -- "$fixture_dir"
          }
          trap cleanup EXIT
          mkdir -p "$release_dir" "$evidence_dir"
          binary="$release_dir/ex-sbom"
          if [[ "$RUNNER_OS" == Windows ]]; then
            binary="$binary.exe"
          fi
          go build -trimpath -tags taggedpdf -o "$binary" .
          go run ./tests/perf/cmd/seed -db "$fixture_dir/fixture.duckdb" -versions 2 -components 8 > "$fixture_dir/fixture.json"
          if [[ "$RUNNER_OS" == Linux ]]; then
            export EX_SBOM_PDF_TEST_TMPDIR="$fixture_dir/noexec"
            mkdir "$EX_SBOM_PDF_TEST_TMPDIR"
            sudo mount -t tmpfs -o noexec,nodev,nosuid,mode=1777,size=256m tmpfs "$EX_SBOM_PDF_TEST_TMPDIR"
            findmnt -n -o OPTIONS --target "$EX_SBOM_PDF_TEST_TMPDIR" | grep -Eq '(^|,)noexec(,|$)'
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            python scripts/check-tagged-pdf-release.py "$binary" "$fixture_dir/fixture.duckdb" "$fixture_dir/fixture.json" "$evidence_dir"
          else
            python3 scripts/check-tagged-pdf-release.py "$binary" "$fixture_dir/fixture.duckdb" "$fixture_dir/fixture.json" "$evidence_dir"
          fi

      - name: Collect long-field PDF from the report route
        env:
          EX_SBOM_PDF_CACHE_DIR: ${{ runner.temp }}/ex-sbom-long-report-typst
        run: |
          set -euo pipefail
          runner_temp="$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == Windows ]]; then
            runner_temp="$(cygpath -u "$runner_temp")"
            test_tmp="$(mktemp -d "$(cygpath -u "$LOCALAPPDATA")/ex-sbom-long-report.XXXXXX")"
            export TEMP="$(cygpath -w "$test_tmp")" TMP="$(cygpath -w "$test_tmp")"
            export EX_SBOM_PDF_CACHE_DIR="$TEMP/cache"
          fi
          report_dir="$runner_temp/tagged-pdf-long-report"
          mkdir -p "$report_dir"
          go test -count=1 -tags 'unit taggedpdf' ./internal/handler/report \
            -run '^TestTaggedReportPreservesAccessibleFieldsAndLongVersions$' -artifacts -outputdir "$report_dir"
          long_report="$(find "$report_dir" -type f -name report-long-version.pdf -print -quit)"
          test -n "$long_report"
          cp "$long_report" "$runner_temp/tagged-pdf-evidence/report-long-version.pdf"

      - name: Verify PDF/UA-1 conformance
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          archive=verapdf-greenfield-1.30.4-installer.zip
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 3 --connect-timeout 15 --max-time 180 --output "$archive" \
            "https://software.verapdf.org/releases/1.30/$archive"
          printf '%s  %s\n' 04415ef3f149526a3048b9889723e81320ddf013bd891bcc7f0f297f3eadcc23 "$archive" | shasum -a 256 -c
          unzip -q "$archive"
          printf 'INSTALL_PATH=%s/verapdf\n' "$RUNNER_TEMP" > verapdf.options
          bash verapdf-greenfield-1.30.4/verapdf-install -options "$RUNNER_TEMP/verapdf.options"
          evidence_dir="$RUNNER_TEMP/tagged-pdf-evidence"
          for lang in en zh-Hant long-version; do
            "$RUNNER_TEMP/verapdf/verapdf" --flavour ua1 --format xml "$evidence_dir/report-$lang.pdf" > "$evidence_dir/verapdf-$lang.xml"
            grep -q 'isCompliant="true"' "$evidence_dir/verapdf-$lang.xml"
          done

      - name: Verify Windows PDF/UA-1 conformance
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'verapdf-greenfield-1.30.4-installer.zip'
          curl.exe --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 3 --connect-timeout 15 --max-time 180 --output $archive 'https://software.verapdf.org/releases/1.30/verapdf-greenfield-1.30.4-installer.zip'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '04415ef3f149526a3048b9889723e81320ddf013bd891bcc7f0f297f3eadcc23') { throw 'veraPDF checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          $installer = Join-Path $env:RUNNER_TEMP 'verapdf-greenfield-1.30.4/verapdf-install.bat'
          $installPath = Join-Path $env:RUNNER_TEMP 'verapdf'
          $options = Join-Path $env:RUNNER_TEMP 'verapdf.options'
          "INSTALL_PATH=$($installPath.Replace('\', '/'))" | Set-Content -LiteralPath $options -Encoding utf8
          & $installer -options $options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $verapdf = Join-Path $installPath 'verapdf.bat'
          foreach ($lang in 'en', 'zh-Hant', 'long-version') {
            $pdf = Join-Path $env:RUNNER_TEMP "tagged-pdf-evidence/report-$lang.pdf"
            $report = Join-Path $env:RUNNER_TEMP "tagged-pdf-evidence/verapdf-$lang.xml"
            & $verapdf --flavour ua1 --format xml $pdf | Set-Content -LiteralPath $report -Encoding utf8
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (!(Select-String -LiteralPath $report -SimpleMatch 'isCompliant="true"' -Quiet)) { throw "PDF/UA-1 validation failed for $lang" }
          }

      - name: Package release assets
        run: |
          set -euo pipefail
          runner_temp="$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == Windows ]]; then
            runner_temp="$(cygpath -u "$runner_temp")"
          fi
          release_dir="$runner_temp/tagged-pdf-release"
          packages="$runner_temp/ex-sbom-release-assets"
          mkdir "$packages"
          mkdir "$release_dir/licenses"
          bundle_dir="internal/service/pdf/bundle/${TAGGED_PLATFORM//-/_}"
          cp LICENSE "$release_dir/licenses/ex-sbom-MIT.txt"
          cp "$bundle_dir/LICENSE" "$release_dir/licenses/Typst-Apache-2.0.txt"
          cp "$bundle_dir/NOTICE" "$release_dir/licenses/Typst-NOTICE.txt"
          cp "$bundle_dir/"*OFL.txt "$release_dir/licenses/"
          cp internal/service/pdf/fonts/OFL.txt "$release_dir/licenses/NotoSansTC-OFL.txt"
          printf 'source_sha=%s\ntarget=%s\n' "$(git rev-parse HEAD)" "$TAGGED_PLATFORM" > "$release_dir/BUILD-INFO"
          go version >> "$release_dir/BUILD-INFO"
          cp "$bundle_dir/typst.sha256" "$release_dir/licenses/Typst-executable.sha256"
          if [[ "$RUNNER_OS" == Windows ]]; then
            python scripts/collect-go-licenses.py "$release_dir/licenses/go"
          else
            python3 scripts/collect-go-licenses.py "$release_dir/licenses/go"
          fi
          (
            cd "$release_dir"
            if [[ "$RUNNER_OS" == Windows ]]; then
              cp ex-sbom.exe "$packages/"
              sha256sum ex-sbom.exe > "$packages/ex-sbom.exe.sha256"
              tar -czf "$packages/ex-sbom-windows-amd64-notices.tar.gz" BUILD-INFO licenses
            else
              shasum -a 256 ex-sbom > SHA256SUMS
              tar -czf "$packages/ex-sbom-$TAGGED_PLATFORM.tar.gz" ex-sbom SHA256SUMS BUILD-INFO licenses
            fi
          )

      - name: Go tests (unit + integration + tagged PDF)
        env:
          EX_SBOM_PDF_CACHE_DIR: ${{ runner.temp }}/ex-sbom-unit-test-typst
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Windows ]]; then
            test_tmp="$(mktemp -d "$(cygpath -u "$LOCALAPPDATA")/ex-sbom-test.XXXXXX")"
            export TEMP="$(cygpath -w "$test_tmp")"
            export TMP="$TEMP"
            export EX_SBOM_PDF_CACHE_DIR="$TEMP/cache"
          fi
          go test -tags 'unit integration taggedpdf' ./...

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: matrix.platform == 'linux-amd64'
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Browser download with the release renderer
        if: matrix.platform == 'linux-amd64'
        working-directory: tests/e2e
        env:
          EX_SBOM_E2E_BINARY: ${{ runner.temp }}/ex-sbom-release-browser.test
          EX_SBOM_E2E_TAGGED_PDF: '1'
          EX_SBOM_PDF_CACHE_DIR: ${{ runner.temp }}/ex-sbom-browser-typst
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          go test -tags 'e2e taggedpdf' -c -o "$EX_SBOM_E2E_BINARY" ../..
          npm test -- --grep '@smoke creates a project|downloads verified remediation findings|formats Go advisory candidates|risk feeds fail'

      - name: Upload verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ex-sbom-release-${{ matrix.platform }}
          path: ${{ runner.temp }}/ex-sbom-release-assets/
          if-no-files-found: error

      - name: Upload successful PDF verification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tagged-pdf-verification-${{ matrix.platform }}
          path: ${{ runner.temp }}/tagged-pdf-evidence/
          if-no-files-found: error

      - name: Upload tagged PDF failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tagged-pdf-failure-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/tagged-pdf-evidence/*.pdf
            ${{ runner.temp }}/tagged-pdf-evidence/*.log
            ${{ runner.temp }}/tagged-pdf-evidence/*.xml
            ${{ runner.temp }}/tagged-pdf-evidence/*.json
            ${{ runner.temp }}/tagged-pdf-long-report/**/report-long-version.pdf
            tests/e2e/test-results/
          if-no-files-found: ignore

  publish-release:
    if: github.ref_type == 'tag'
    needs: [build-and-test, tagged-pdf]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ex-sbom-release-*
          merge-multiple: true
          path: release
      - name: Attest release asset provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/*
      - name: Prepare a draft release with the verified executables
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view --repo "$GITHUB_REPOSITORY" --json isDraft,assets -- "$RELEASE_TAG" > existing-release.json; then
            jq -e '.isDraft' existing-release.json >/dev/null || {
              echo "Release $RELEASE_TAG is already published" >&2
              exit 1
            }
            for asset in release/*; do
              name=${asset##*/}
              expected="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
              current="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' existing-release.json)"
              if [[ -z "$current" ]]; then
                gh release upload --repo "$GITHUB_REPOSITORY" -- "$RELEASE_TAG" "$asset"
              elif [[ "$current" != "$expected" ]]; then
                echo "Draft asset $name has a different digest" >&2
                exit 1
              fi
            done
          else
            gh release create --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes -- "$RELEASE_TAG" release/*
          fi
