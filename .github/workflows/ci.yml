name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # Every Go test file carries a build tag, so a bare `go test ./...`
      # compiles no tests at all — the tags are required.
      - name: Go tests (unit + integration)
        run: go test -tags "unit integration" ./...

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Frontend tests
        run: node --test "tests/js/*.test.mjs"
