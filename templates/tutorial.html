<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ex-sbom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
    <style>
      .tab-active {
        border-bottom: 2px solid #009999;
        background-color: rgba(0, 153, 153, 0.1);
      }

      .language-btn {
        transition: all 0.2s;
      }

      .language-btn:hover {
        background-color: rgba(0, 153, 153, 0.1);
      }

      .active-language {
        background-color: rgba(0, 153, 153, 0.2);
        color: #009999;
      }

      .preserve-whitespace {
        white-space: pre-line;
      }
    </style>
  </head>

  <body>
    <header class="bg-white shadow">
      <div
        class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between"
      >
        <div class="flex items-center space-x-2">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-7 w-7 text-[#009999]"
            viewBox="0 0 20 20"
            fill="currentColor"
          >
            <path
              fill-rule="evenodd"
              d="M2 5a2 2 0 012-2h12a2 2 0 012 2v10a2 2 0 01-2 2H4a2 2 0 01-2-2V5zm3.293 1.293a1 1 0 011.414 0l3 3a1 1 0 010 1.414l-3 3a1 1 0 01-1.414-1.414L7.586 10 5.293 7.707a1 1 0 010-1.414zM11 12a1 1 0 100 2h3a1 1 0 100-2h-3z"
              clip-rule="evenodd"
            />
          </svg>
          <h1
            class="text-2xl font-bold text-gray-800 tracking-tight"
            data-i18n="appTitle"
          >
            ex-sbom
          </h1>
        </div>

        <div class="flex items-center space-x-3">
          <!-- Language switcher -->
          <div class="flex text-sm">
            <button
              id="lang-en"
              class="px-2 py-1 rounded font-medium language-btn active-language"
              onclick="changeLanguage('en')"
            >
              EN
            </button>
            <button
              id="lang-zh"
              class="px-2 py-1 rounded font-medium language-btn"
              onclick="changeLanguage('zh')"
            >
              正體中文
            </button>
          </div>

          <div class="ml-6">
            <button
              id="back-btn"
              class="px-3 py-1 bg-gray-200 hover:bg-gray-300 text-gray-800 rounded text-sm flex items-center"
              onclick="window.location.href='/'"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4 mr-1"
                viewBox="0 0 20 20"
                fill="currentColor"
              >
                <path
                  fill-rule="evenodd"
                  d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z"
                  clip-rule="evenodd"
                />
              </svg>
              <span data-i18n="backToMain">Back to Main Page</span>
            </button>
          </div>

          <!-- Divider -->
          <div class="text-gray-400">|</div>

          <!-- App description -->
          <div
            class="text-sm text-gray-600"
            id="app-description"
            data-i18n="appDescription"
          >
            SBOM Explorer, designed by NICS-ra
          </div>
        </div>
      </div>
    </header>

    <div>
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <h2 class="text-xl font-semibold mb-4" data-i18n="whyMakeThisTool"></h2>
        <p class="text-gray-700 preserve-whitespace" data-i18n="reasonParagraph"></p>
      </div>
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <h2 class="text-xl font-semibold mb-4" data-i18n="StepsTitle"></h2>
        <ol class="list-decimal pl-6 space-y-2">
          <li class="text-gray-700" data-i18n="Step1"></li>
          <li class="text-gray-700" data-i18n="Step2"></li>
          <li class="text-gray-700" data-i18n="Step3"></li>
          <li class="text-gray-700" data-i18n="Step4"></li>
          <li class="text-gray-700" data-i18n="Step5"></li>
          <li class="text-gray-700" data-i18n="Step6"></li>
          <li class="text-gray-700" data-i18n="Step7"></li>
          <li class="text-gray-700" data-i18n="Step8"></li>
        </ol>
        <div class="mt-4 p-4 bg-gray-100 rounded">
          <p class="text-gray-700" data-i18n="Step5Additional1"></p>
          <p class="text-gray-700" data-i18n="Step5Additional2"></p>
          <p class="text-gray-700" data-i18n="Step5Additional3"></p>
        </div>
      </div>
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <h2 class="text-xl font-semibold mb-4">CVSS</h2>
        <p class="text-gray-700 preserve-whitespace" data-i18n="CVSSExplain"></p>
        <h2 class="text-xl font-semibold mb-4 mt-6">EPSS</h2>
        <p class="text-gray-700 preserve-whitespace" data-i18n="EPSSExplain"></p>
        <h2 class="text-xl font-semibold mb-4 mt-6">LEV</h2>
        <p class="text-gray-700 preserve-whitespace" data-i18n="LEVExplain"></p>
      </div>
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <h2 class="text-xl font-semibold mb-4" data-i18n="ThingsYouNeedToKnow"></h2>
        <p class="text-gray-700 preserve-whitespace" data-i18n="SBOMEffectiveness"></p>
      </div>
    </div>

    <script>
      // Language translations
      const translations = {
        en: {
          appTitle: "ex-sbom",
          appDescription: "SBOM Explorer, designed by NICS-ra",
          backToMain: "Back to Main",

          // tutorial contents
          whyMakeThisTool: "Why we made this tool?",
          reasonParagraph:
            "SBOMs (Software Bill of Materials) are essential for understanding the components and dependencies of software systems. " +
            "They help identify vulnerabilities, support compliance work, and manage software supply chain risk with a more precise view of what is actually included in a product. " +
            "However, SBOM data can be difficult to interpret, especially when multiple scan results must be compared over time. " +
            "ex-sbom provides a visual, project-based workflow for importing SBOMs, saving each scan as a version, exploring dependency and vulnerability impact paths, searching across versions, comparing changes, and exporting reports.",
          StepsTitle: "Steps to use this tool",
          Step1: "Create or select a project. Type a name in the 'New project name' field and click 'Switch' to create a new one, or pick an existing project from the dropdown. A project groups related SBOM versions for the same product or system.",
          Step2: "In the 'SBOM Analysis' tab, click the 'Add Version' button to open the upload dialog.",
          Step3: "Choose the SBOM file you want to upload (CycloneDX or SPDX, JSON format only) and click 'Preview'. The tool parses the file and scans its components for known vulnerabilities.",
          Step4: "Give the parsed result a version name and click 'Create Version' to save it. If a file with the same content already exists, you will be notified. All saved versions appear under 'Version History'.",
          Step5: "Open a saved version and click any component in the dependency graph or list to view detailed information, including dependencies, vulnerability information, licenses, and suggested fix versions.",
          Step6: "Use the search bar to find a component or CVE across all versions of the project, and quickly locate which versions are affected.",
          Step7: "Switch to the 'Diff' tab to compare two versions of the project and see which components were added, removed, or changed, along with a vulnerability summary.",
          Step8: "For any version, you can export a PDF report of its vulnerability findings for sharing or record keeping.",
          Step5Additional1: "Additionally, if a component is displayed in the default gray-white color, it means that the component has no vulnerabilities and does not use any components with known vulnerabilities.",
          Step5Additional2: "If a component is displayed in red, it means that the component itself has vulnerabilities.",
          Step5Additional3: "If a component is displayed in yellow, it means that the component itself does not have vulnerabilities, but it uses another component that has vulnerabilities.",
          CVSSExplain: "CVSS (Common Vulnerability Scoring System) is a standardized framework for assessing the severity of information security vulnerabilities." +
            " It provides a numerical range (from 0 to 10) to represent the severity of a vulnerability, considering multiple factors including exploitability, impact, and potential effects on systems." +
            " CVSS scores help organizations prioritize vulnerability remediation efforts and develop effective security strategies.",
          EPSSExplain: "EPSS (Exploit Prediction Scoring System) is a scoring system used to predict the likelihood of information security vulnerabilities being exploited." +
            " It evaluates the probability of a specific vulnerability being exploited in the future based on historical data and machine learning models." +
            " EPSS scores help organizations identify high-risk vulnerabilities, prioritize remediation efforts, and strengthen defense measures.",
          LEVExplain: "LEV (Likelihood of Exploitability Value) is an indicator used to assess the recent likelihood of information security vulnerabilities being exploited." +
            " It is based on exploitation data from the past 30 days and provides a score range from 0 to 1.",
          ThingsYouNeedToKnow: "Some things you might need to know",
          SBOMEffectiveness: "The effectiveness of an SBOM depends on its timeliness, completeness of supply chain information, and its correspondence to the actual software version." +
            " An outdated or incomplete SBOM may not accurately reflect the true state of the software, thereby affecting its utility in vulnerability management and compliance." +
            " Therefore, regularly updating and maintaining the SBOM is key to ensuring its effectiveness."+
            " Additionally, it is important to ensure that the components you use disclose the components they depend on, otherwise it may lead to concerns about broken supply chain information."+
            " For shared components that cannot be made public within an organization, we sincerely recommend conducting independent scans for such components to ensure their security.",
        },
        zh: {
          appTitle: "ex-sbom",
          appDescription: "SBOM explorer，由 NICS-ra 設計",
          backToMain: "返回主頁",

          // tutorial contents
          whyMakeThisTool: "為什麼我們要做這個工具？",
          reasonParagraph:
            "SBOM（軟體物料清單）對於理解軟體系統中的元件與相依關係相當重要。" +
            "它能以更精確的方式協助開發與資安人員識別漏洞、支援合規作業，並管理軟體供應鏈風險。" +
            "然而，SBOM 資料往往不容易閱讀，尤其當需要比較多次掃描結果、追蹤元件與弱點變化時更是如此。"+
            "因此，ex-sbom 提供以專案為核心的視覺化流程，協助使用者匯入 SBOM、將每次掃描儲存為版本、探索相依性與弱點影響路徑、跨版本搜尋與比對，並匯出報告。",
          StepsTitle: "使用此工具的步驟",
          Step1: "建立或選擇一個專案。在「New project name」欄位輸入名稱並點擊「Switch」即可建立新專案，或從下拉選單中選擇既有專案。專案可用來彙整同一產品或系統的多個 SBOM 版本。",
          Step2: "在「SBOM 分析」分頁中，點擊「新增版本」按鈕以開啟上傳視窗。",
          Step3: "選擇您想要上傳的 SBOM 檔案（支援 CycloneDX 與 SPDX，僅限 JSON 格式），並點擊「預覽」。工具會解析檔案並掃描其中元件是否存在已知漏洞。",
          Step4: "為解析後的結果命名一個版本名稱，並點擊「建立版本」以儲存。若上傳的檔案內容與既有版本相同，系統會提示您。所有已儲存的版本都會顯示在「版本歷史」中。",
          Step5: "開啟已儲存的版本後，點擊相依性圖或列表中的任一元件，即可查看該元件的詳細資訊，包括其依賴關係、漏洞資訊、授權（License）以及建議修復版本等。",
          Step6: "使用搜尋列即可在專案的所有版本中搜尋特定元件或 CVE，並快速定位其出現於哪些版本。",
          Step7: "切換到「Diff 比對」分頁，即可比較專案中的兩個版本，查看新增、移除或變更的元件，以及漏洞的彙總資訊。",
          Step8: "針對任一版本，您都可以匯出其漏洞發現的 PDF 報告，方便分享或留存記錄。",
          Step5Additional1: "另外值得注意的是，當元件為預設灰白配色時，代表其元件不存在漏洞，也沒有使用到任何已知存在漏洞的元件。",
          Step5Additional2: "若元件為紅色，則代表其元件本身存在漏洞",
          Step5Additional3: "若元件為黃色，則代表其元件本身並沒有漏洞，但是有使用到的某個元件存在漏洞",
          CVSSExplain: "CVSS (Common Vulnerability Scoring System) 是一個用於評估資訊安全漏洞嚴重性的標準化框架。" +
            "它提供了一個數值範圍（從 0 到 10），用於表示漏洞的嚴重程度，並且考慮了多個因素，包括漏洞的可利用性、影響範圍以及對系統的潛在影響。" +
            "CVSS 分數有助於組織優先處理漏洞修復工作，並制定有效的安全策略。",
          EPSSExplain: "EPSS (Exploit Prediction Scoring System) 是一個用於預測資訊安全漏洞被利用可能性的評分系統。" +
            "它基於歷史數據和機器學習模型，評估特定漏洞在未來被攻擊者利用的概率。" +
            "EPSS 分數有助於組織識別高風險漏洞，從而優先考慮修復工作並加強防禦措施。",
          LEVExplain: "LEV (Likelihood of Exploitability Value) 是一個用於評估資訊安全漏洞近期被利用可能性的指標。" +
            "它基於過往 30 天內的漏洞利用數據，提供了一個從 0 到 1 的分數範圍。",
          ThingsYouNeedToKnow: "一些你可能需要知道的資訊",
          SBOMEffectiveness: "SBOM 的有效性取決於其時效性、供應鏈資訊完整性，以及與實際軟體版本的對應關係。" +
            "過時或不完整的 SBOM 可能無法準確反映軟體的真實狀態，從而影響其在漏洞管理和合規性方面的效用。" +
            "因此，定期更新和維護 SBOM 是確保其有效性的關鍵。"+
            "此外，需要確保你使用的元件是否有揭露其使用到的元件，否則可能會造成元件供應鏈資訊斷鏈的疑慮。"+
            "針對單位內部無法公開之共用元件，我們誠摯建議針對該類型元件獨立進行掃描，以確保其安全性。",
        },
      };

      // Current language
      let currentLanguage = "en";

      // Function to change language
      function changeLanguage(lang) {
        currentLanguage = lang;
        document
          .getElementById("lang-en")
          .classList.toggle("active-language", lang === "en");
        document
          .getElementById("lang-zh")
          .classList.toggle("active-language", lang === "zh");

        // Update all text elements with data-i18n attribute
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          el.textContent = translations[currentLanguage][key] || key;
        });
      }

      // Initialize the language based on browser preference
      document.addEventListener("DOMContentLoaded", function () {
        const browserLang = navigator.language || navigator.userLanguage;
        if (browserLang.startsWith("zh")) {
          changeLanguage("zh");
        } else {
          changeLanguage("en");
        }
      });
    </script>
  </body>
</html>
