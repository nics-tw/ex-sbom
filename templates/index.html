<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ex-sbom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
    <link rel="stylesheet" href="/static/css/site.css" />
  </head>
  <body>
    <a class="site-skip" href="#main-content" data-shell-i18n="skipToMain">Skip to main content</a>
    <header class="site-header">
      <div class="site-container site-header-inner">
        <div class="site-brand">
          <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" class="site-mark" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M2 5a2 2 0 012-2h12a2 2 0 012 2v10a2 2 0 01-2 2H4a2 2 0 01-2-2V5zm3.293 1.293a1 1 0 011.414 0l3 3a1 1 0 010 1.414l-3 3a1 1 0 01-1.414-1.414L7.586 10 5.293 7.707a1 1 0 010-1.414zM11 12a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd" />
          </svg>
          <h1 class="site-brand-title">ex-sbom</h1>
        </div>
        <nav class="site-navigation" aria-label="Site navigation" data-shell-aria-label="siteNavigation">
          <a id="tutorial-btn" class="site-navigation-link" href="/tutorial" data-shell-i18n="tutorialBtn">Tutorial</a>
        </nav>
        <div class="site-language" role="group" aria-label="Display language" data-shell-aria-label="displayLanguage">
          <button type="button" id="lang-en" class="language-btn active-language" aria-pressed="true" lang="en">English</button>
          <button type="button" id="lang-zh" class="language-btn" aria-pressed="false" lang="zh-Hant">正體中文</button>
        </div>
        <div class="site-description" id="app-description" data-shell-i18n="appDescription">SBOM Explorer, designed by NICS-ra</div>
      </div>
    </header>

    <main id="main-content" class="site-container site-main" tabindex="-1">
      <!-- Project selector -->
      <div class="project-controls mb-6 p-3 bg-gray-50 rounded-lg border border-gray-200">
        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
          <path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" />
        </svg>
        <label for="project-select" class="text-sm font-medium text-gray-600" data-i18n="project">Project</label>
        <select id="project-select" class="project-field border rounded-md py-1.5 px-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#009999]"></select>
        <button id="project-rename-btn" class="control-secondary inline-flex items-center gap-1 border text-xs font-medium py-1 px-2 rounded transition-colors duration-150">
          <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor">
            <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
          </svg>
          <span data-i18n="projectRename">Rename</span>
        </button>
        <button id="project-delete-btn" class="control-danger inline-flex items-center gap-1 border text-xs font-medium py-1 px-2 rounded transition-colors duration-150">
          <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
          </svg>
          <span data-i18n="projectDelete">Delete</span>
        </button>
        <label for="project-input" class="text-sm font-medium text-gray-600" data-shell-i18n="newProject">New project name</label>
        <input id="project-input" type="text" placeholder="New project name" class="project-field border rounded-md py-1.5 px-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#009999]" data-i18n-placeholder="newProject" />
        <button id="project-switch-btn" class="control-primary text-sm font-medium py-1.5 px-4 rounded-md shadow transition duration-200">
          <span data-i18n="projectSwitch">Switch</span>
        </button>
        <span id="project-current" class="project-current text-sm text-gray-600"></span>
      </div>

      <!-- Main tab bar -->
      <div class="analysis-controls border-b border-gray-200 mb-6">
        <button id="main-tab-analysis" aria-pressed="true" aria-controls="panel-analysis" class="main-tab px-5 py-2.5 text-sm font-medium -mb-px" data-shell-i18n="analysisTab">SBOM Analysis</button>
        <button id="main-tab-diff" aria-pressed="false" aria-controls="panel-diff" class="main-tab px-5 py-2.5 text-sm font-medium -mb-px" data-shell-i18n="diffTab">Compare Versions</button>
        <div class="ml-auto pb-1">
          <button id="select-sbom-btn" class="control-primary text-sm font-medium py-1.5 px-4 rounded-md shadow transition duration-200 flex items-center gap-2">
            <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
            </svg>
            <span data-i18n="selectFiles">新增版本</span>
          </button>
        </div>
      </div>

      <!-- Diff 比對 panel -->
      <div id="panel-diff" class="hidden"></div>

      <!-- SBOM 分析 panel -->
      <div id="panel-analysis">
        <!-- Search bar -->
        <div class="search-controls mb-4">
          <div class="relative flex-1 max-w-md">
            <label for="search-input" class="site-visually-hidden" data-shell-i18n="searchLabel">Search components or CVEs</label>
            <input id="search-input" type="search" placeholder="Search components or CVEs" data-shell-placeholder="searchLabel"
              class="w-full border border-gray-300 rounded-md py-2 pl-9 pr-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#009999]" />
            <svg aria-hidden="true" focusable="false" class="absolute left-2.5 top-2.5 h-4 w-4 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
            </svg>
          </div>
          <button id="search-clear-btn" class="hidden text-sm text-gray-700 underline" data-shell-i18n="clearSearch">Clear search</button>
        </div>
        <p id="search-status" role="status" class="text-sm text-gray-700"></p>
        <div id="search-results" class="hidden mb-4 border border-gray-200 rounded-md bg-white shadow-sm max-h-80 overflow-y-auto"></div>
        <div id="upload-status"></div>
        <!-- 版本歷史 -->
        <div class="mt-6">
          <h2 class="site-section-title" data-shell-i18n="versionHistory">Version History</h2>
          <div id="version-history-list" class="mt-2">
            <p class="text-gray-600 italic text-sm" data-shell-i18n="loading">Loading…</p>
          </div>
        </div>
        <div class="mt-4 border-b border-gray-200">
          <h2 class="site-section-title" data-i18n="uploadedFiles">Uploaded SBOM Files</h2>
          <div id="file-tabs" class="flex flex-wrap"></div>
        </div>
        <div id="tab-content" class="py-4">
          <div id="no-tabs-message" class="text-gray-500 italic" data-i18n="noFilesUploaded">No files processed yet</div>
        </div>
      </div>
    </main>

    <!-- SBOM Modal (two-state: pick file → preview result) -->
    <dialog id="sbom-modal" aria-labelledby="sbom-pick-title" class="sbom-dialog">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-4xl p-6">

        <!-- Step 1: pick file -->
        <div id="sbom-modal-step1">
          <h2 id="sbom-pick-title" class="text-lg font-semibold text-gray-800 mb-4" data-i18n="uploadSelectTitle">Select SBOM file</h2>
          <input type="file" id="sbom-file-input" class="hidden" accept=".json,.xml,.spdx" />
          <div class="flex items-center gap-3 mb-6">
            <button id="sbom-pick-file-btn" class="control-secondary px-3 py-1.5 text-sm rounded-md border transition-colors" data-i18n="uploadPick" autofocus>Choose file</button>
            <span id="sbom-filename-display" class="text-sm text-gray-500 truncate">尚未選擇檔案</span>
          </div>
          <p id="sbom-modal-step1-error" role="alert" class="inline-error text-sm text-red-700"></p>
          <div class="flex flex-wrap justify-end gap-3">
            <button id="sbom-modal-cancel" class="px-4 py-2 text-sm rounded-md border border-gray-300 text-gray-600 hover:bg-gray-50" data-i18n="uploadCancel">Cancel</button>
            <button id="sbom-modal-preview-btn" class="px-4 py-2 text-sm rounded-md control-primary font-medium" data-i18n="uploadPreview">Preview</button>
          </div>
        </div>

        <!-- Step 2: preview result + create version -->
        <div id="sbom-modal-step2" class="hidden">
          <h2 id="sbom-preview-title" class="text-lg font-semibold text-gray-800 mb-4">預覽結果</h2>
          <div id="sbom-preview-summary" class="mb-4 text-sm"></div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Version name</label>
          <input id="sbom-version-input" aria-describedby="sbom-version-hint sbom-modal-step2-error" type="text"
            class="w-full border border-gray-300 rounded-md py-2 px-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#009999] mb-1" />
          <p id="sbom-version-hint" class="text-xs text-gray-600 mb-2"></p>
          <p id="sbom-modal-step2-error" role="alert" class="inline-error text-sm text-red-700"></p>
          <div class="flex flex-wrap justify-end gap-3 mt-4">
            <button id="sbom-modal-back-btn" class="px-4 py-2 text-sm rounded-md border border-gray-300 text-gray-600 hover:bg-gray-50" data-i18n="uploadBack">Back</button>
            <button id="sbom-modal-commit-btn" class="px-4 py-2 text-sm rounded-md control-primary font-medium disabled:bg-gray-300 disabled:cursor-not-allowed" data-i18n="uploadCommit">Save version</button>
          </div>
        </div>

      </div>
    </dialog>

    <script src="/static/js/language.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/request-slot.js"></script>
    <script src="/static/js/result-view.js"></script>
    <script src="/static/js/app.js"></script>
  </body>
</html>
